services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: retinax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retinax}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided via environment or .env file}"
      POSTGRES_DB: ${POSTGRES_DB:-retinax_care}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retinax} -d ${POSTGRES_DB:-retinax_care}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: retinax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

 
  # 4. FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: retinax_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-retinax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retinax_care}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be provided via environment or .env file}"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  # 5. Celery Worker (Asynchronous Reminders & Reconciliation)
  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: retinax_celery_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-retinax}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-retinax_care}"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: "${SECRET_KEY:?Error: SECRET_KEY must be provided via environment or .env file}"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info

    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.tasks.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 6. Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: retinax_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

